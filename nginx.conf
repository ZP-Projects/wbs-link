server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Historical bookmarks resolve to the one current PDF, never a second edition.
    location ~ ^/examples/harbourlink/(cycle[12])/Integrated_Management_Report_Phone\.pdf$ {
        return 307 /examples/harbourlink/$1/Integrated_Management_Report_Print.pdf;
    }
    location / { try_files $uri $uri/ =404; }
}
