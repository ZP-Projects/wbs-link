<g fill="#1b2940" stroke="#65748a"><rect x="14" y="62" width="104" height="98" rx="8"/><rect x="143" y="62" width="104" height="98" rx="8"/><rect x="272" y="62" width="104" height="98" rx="8"/></g>
<g text-anchor="middle" font-size="18" font-weight="700"><text x="66" y="106">Schedule</text><text x="195" y="97">Cost /</text><text x="195" y="120">forecast</text><text x="324" y="97">Package /</text><text x="324" y="120">contract</text></g>
<g class="source-connections" stroke="#d5a579" stroke-width="2.5"><path class="source-connection" data-source="schedule" d="M66 160V236"/><path class="source-connection" data-source="cost" d="M195 160V236"/><path class="source-connection" data-source="package" d="M324 160V236"/></g>
<rect x="14" y="236" width="362" height="86" rx="8" fill="#1b2940" stroke="#d5a579" stroke-width="2"/>
<text x="195" y="271" text-anchor="middle" font-size="26" font-weight="700">OWNER WBS</text><text x="195" y="297" text-anchor="middle" font-size="17">Professional review and approval</text>
<path class="reviewed-output-connection" d="M195 322V362" stroke="#d5a579" stroke-width="2.5"/>
<rect x="14" y="362" width="362" height="86" rx="8" fill="#1b2940" stroke="#65748a"/>
<text x="195" y="397" text-anchor="middle" font-size="22" font-weight="700">Approved position</text><text x="195" y="423" text-anchor="middle" font-size="17">Issues for review · source evidence</text>
