<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 500" role="img" aria-labelledby="title desc">
<title id="title">Three source views meet through the Owner WBS</title><desc id="desc">Three independent Schedule, Cost / forecast and Package / contract connections terminate at the Owner WBS. The reviewed WBS leads to approved position, issues and source evidence. Missing evidence still required is shown separately as open review; no direct source-to-source link or automatic approval.</desc>
