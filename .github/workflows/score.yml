name: Score submission
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: { group: "scoring-${{ github.event.issue.number }}", cancel-in-progress: false }
jobs:
  score:
    if: startsWith(github.event.issue.title, '[Submission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Score
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HOLDOUT_KEY: ${{ secrets.HOLDOUT_KEY }}
        run: python scorer/score_issue.py
      - name: Reply on the issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment ${{ github.event.issue.number }} --body-file result.md
      - name: Update leaderboard
        run: |
          git config user.name "wbslink-bot"
          git config user.email "wbslink-bot@users.noreply.github.com"
          git add docs/data/ledger.json docs/data/leaderboard.json || true
          git diff --cached --quiet || (git commit -m "Scored submission #${{ github.event.issue.number }}" && git pull --rebase && git push)
