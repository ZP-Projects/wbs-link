name: Commercial Experience TEST-SHOW

on:
  push:
    branches:
      - eng/codex-commercial-experience
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect phase
        id: phase
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%B)"
          if [[ "$msg" == *"[commercial-generated]"* ]]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover authoritative HarbourLink blind practice ZIP
        if: steps.phase.outputs.generated != 'true'
        shell: bash
        run: |
          curl -fsSL 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-f2ec-820c-b8ff-0b9b448739f9/raw?se=2026-10-08T16%3A01%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=5490bb20-000d-5d5e-b8f6-4ba5b0975c82&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-08T12%3A53%3A26Z&ske=2026-10-09T12%3A53%3A26Z&sks=b&skv=2026-02-06&sig=OYWoUvtZwSQYLNsmmMxkaV9Eq7t7/VahNitjfpkiToQ%3D' -o /tmp/wp-flagship-01-test-show.zip
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path

          artifact = Path('/tmp/wp-flagship-01-test-show.zip')
          out = Path('docs/downloads/harbourlink-practice-project.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          base = 'flagship_demo_run/packages/case_a_major_infrastructure/user_package/'
          names = [
              'README.txt',
              'case_briefing.md',
              'mission_guide.md',
              'cycle1/owner_wbs.xlsx',
              'cycle1/contractor_schedule.csv',
              'cycle1/monthly_cost_forecast.xlsx',
              'cycle1/package_register.xlsx',
              'cycle2/owner_wbs.xlsx',
              'cycle2/contractor_schedule.csv',
              'cycle2/monthly_cost_forecast.xlsx',
              'cycle2/package_register.xlsx',
          ]
          readme = """WBS↔LINK HarbourLink Practice Project

          This fictional synthetic project is the standard first-run practice experience for WBS↔LINK.

          Recommended sequence
          1. Read case_briefing.md.
          2. Read mission_guide.md.
          3. Use only the Cycle 1 files first.
          4. Complete the WBS↔LINK journey and review Project Intelligence and outputs.
          5. Then use the Cycle 2 files and review what remained valid and what changed.

          Included source types
          - Owner WBS
          - Contractor schedule
          - Monthly cost / forecast
          - Package register

          This package contains fictional synthetic practice data only. No real client or confidential project data is included.
          """.replace('          ', '').encode('utf-8')

          with zipfile.ZipFile(artifact) as src, zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as dst:
              for name in names:
                  data = readme if name == 'README.txt' else src.read(base + name)
                  zi = zipfile.ZipInfo(name, date_time=(2026, 10, 8, 15, 38, 54))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.create_system = 3
                  zi.external_attr = 0x01800000
                  dst.writestr(zi, data)

          expected = '4ff169ac299bff0cecf5a67674d4a42931cb7d571031df634044c37a0dd9774e'
          actual = hashlib.sha256(out.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert z.namelist() == names
              low = '\n'.join(z.namelist()).lower()
              for bad in ('truth_package','oracle','expected_conditions','answer_key','reference_mapping'):
                  assert bad not in low, bad
          print('harbourlink-practice-project.zip sha256=' + actual)
          print('authoritative blind package recovery: PASS')
          PY
          rm -f /tmp/wp-flagship-01-test-show.zip

      - name: Install media and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Verify retained accepted flagship proof assets
        run: |
          test -s docs/assets/flagship/project-intelligence-cycle1.svg
          test -s docs/assets/flagship/cycle2-changes.svg
          test -s docs/assets/flagship/premium-workbook.jpg
          test -s docs/assets/flagship/management-briefing.svg
          test -s docs/assets/flagship/outputs-cycle1.svg

      - name: Generate commercial videos and posters
        if: steps.phase.outputs.generated != 'true'
        run: |
          python docs/videos/source/generate_commercial_videos.py
          test -s docs/videos/wbslink-video-1-challenge.mp4
          test -s docs/videos/wbslink-video-1-challenge.jpg
          test -s docs/videos/wbslink-video-2-how-it-works.mp4
          test -s docs/videos/wbslink-video-2-how-it-works.jpg

      - name: Static, claim, accessibility and leakage checks
        run: |
          set -o pipefail
          python test_commercial_experience.py | tee /tmp/commercial-static.log

      - name: Start local commercial site
        run: |
          python -m http.server 8000 --directory docs >/tmp/commercial-http.log 2>&1 &
          echo $! > /tmp/commercial-http.pid
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep .25
          done
          cat /tmp/commercial-http.log
          exit 1

      - name: Desktop and mobile SHOW evidence
        run: |
          python scripts/render_commercial_evidence.py
          test -s evidence/commercial-experience/website-desktop.png
          test -s evidence/commercial-experience/website-mobile.png
          python - <<'PY'
          import json
          p=json.load(open('evidence/commercial-experience/browser-check.json'))
          assert not p['views']['desktop']['horizontalOverflow'], p
          assert not p['views']['mobile']['horizontalOverflow'], p
          assert not p['views']['desktop']['brokenImages'], p
          assert not p['views']['mobile']['brokenImages'], p
          print('browser-responsive-checks: PASS')
          PY

      - name: Video and blind-package evidence
        run: |
          ffprobe -v error -show_entries format=duration,size -of json docs/videos/wbslink-video-1-challenge.mp4 > /tmp/video1.json
          ffprobe -v error -show_entries format=duration,size -of json docs/videos/wbslink-video-2-how-it-works.mp4 > /tmp/video2.json
          python - <<'PY'
          import json, zipfile
          v1=json.load(open('/tmp/video1.json'))['format']
          v2=json.load(open('/tmp/video2.json'))['format']
          d1=float(v1['duration']); d2=float(v2['duration'])
          assert 55 <= d1 <= 95, d1
          assert 65 <= d2 <= 105, d2
          z='docs/downloads/harbourlink-practice-project.zip'
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
              low='\n'.join(names).lower()
              for bad in ('truth_package','oracle','expected_conditions','answer_key','reference_mapping'):
                  assert bad not in low, bad
              assert any(x.lower().startswith('cycle1/') for x in names)
              assert any(x.lower().startswith('cycle2/') for x in names)
          print(f'video1_seconds={d1:.2f}')
          print(f'video2_seconds={d2:.2f}')
          print('blind-practice-package: PASS')
          PY

      - name: Raw public-branch smoke
        if: steps.phase.outputs.generated == 'true'
        run: |
          base="https://raw.githubusercontent.com/ZP-Projects/wbs-link/$GITHUB_SHA"
          curl -fsSI "$base/docs/index.html"
          curl -fsSI "$base/docs/videos/wbslink-video-1-challenge.mp4"
          curl -fsSI "$base/docs/videos/wbslink-video-2-how-it-works.mp4"
          curl -fsSI "$base/docs/downloads/harbourlink-practice-project.zip"
          echo "raw-public-branch-smoke: PASS"

      - name: Retain BUILD TEST SHOW evidence
        if: steps.phase.outputs.generated != 'true'
        shell: bash
        run: |
          rm -rf docs/videos/source/_frames
          mkdir -p evidence/commercial-experience
          {
            echo "# #52 Commercial Experience BUILD → TEST → SHOW"
            echo
            echo "- Source implementation SHA: $GITHUB_SHA"
            echo "- Accepted flagship evidence SHA: abb47dd0c49190b10caa1fe0807c30daab5b2da1"
            echo "- Branch: eng/codex-commercial-experience"
            echo "- Static / claim / accessibility / leakage checks: PASS"
            echo "- Desktop 1440px browser render: PASS"
            echo "- Mobile 390px browser render: PASS"
            echo "- Horizontal overflow: NONE"
            echo "- Video 1 duration contract: PASS"
            echo "- Video 2 duration contract: PASS"
            echo "- HarbourLink blind package audit: PASS"
            echo "- Publication/deployment: NOT PERFORMED"
            echo
            echo "Final exact generated-artifact SHA is verified by the follow-on exact-head workflow run."
          } > evidence/commercial-experience/TEST_SHOW.md
          cp /tmp/commercial-static.log evidence/commercial-experience/static-checks.log
          ffprobe -v error -show_entries format=duration,size -of json docs/videos/wbslink-video-1-challenge.mp4 > evidence/commercial-experience/video1-probe.json
          ffprobe -v error -show_entries format=duration,size -of json docs/videos/wbslink-video-2-how-it-works.mp4 > evidence/commercial-experience/video2-probe.json
          find docs evidence/commercial-experience -type f -print0 | sort -z | xargs -0 sha256sum > evidence/commercial-experience/SHA256SUMS
          sha256sum --check evidence/commercial-experience/SHA256SUMS

      - name: Commit generated commercial artifacts to isolated branch
        if: steps.phase.outputs.generated != 'true'
        shell: bash
        run: |
          git config user.name "Engineering ChatGPT Codex"
          git config user.email "308842994+ZP-Projects@users.noreply.github.com"
          git add docs/assets/flagship/premium-workbook.jpg docs/assets/flagship/*.svg
          git add docs/videos/wbslink-video-1-challenge.mp4 docs/videos/wbslink-video-1-challenge.jpg
          git add docs/videos/wbslink-video-2-how-it-works.mp4 docs/videos/wbslink-video-2-how-it-works.jpg
          git add docs/downloads/harbourlink-practice-project.zip
          git add evidence/commercial-experience
          git commit -m "chore(commercial): retain generated #52 TEST-SHOW evidence [commercial-generated]"
          git push origin HEAD:eng/codex-commercial-experience

      - name: Verify retained checksums at exact generated head
        if: steps.phase.outputs.generated == 'true'
        run: |
          sha256sum --check evidence/commercial-experience/SHA256SUMS

      - name: Upload exact-run assurance evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-test-show-${{ github.sha }}
          path: |
            evidence/commercial-experience
            docs/videos/wbslink-video-1-challenge.mp4
            docs/videos/wbslink-video-1-challenge.jpg
            docs/videos/wbslink-video-2-how-it-works.mp4
            docs/videos/wbslink-video-2-how-it-works.jpg
            docs/downloads/harbourlink-practice-project.zip
            docs/videos/source
          if-no-files-found: error
          retention-days: 14
